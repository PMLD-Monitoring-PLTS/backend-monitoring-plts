name: CI Pipeline

# Hanya jalan saat push atau pull request ke branch main dan dev
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  # ============================================================
  # Job 1: Unit Test
  # Spin up PostgreSQL sebagai service, lalu jalankan pytest
  # ============================================================
  test:
    name: Unit Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: plts_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/plts_test_db
      DEVICE_API_KEY: ESP8266_PLTS_SECRET_KEY
      SUPERADMIN_EMAIL: admin@plts.com
      SUPERADMIN_PASSWORD: Admin@PLTS2026!
      JWT_SECRET_KEY: test-secret-key-for-ci
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      PYTHONPATH: .

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Install test dependencies
        run: pip install pytest httpx

      - name: Jalankan unit test
        working-directory: backend
        run: pytest tests/ -v

  # ============================================================
  # Job 2: Build Docker Image
  # Hanya jalan setelah job test lulus
  # Memastikan Dockerfile tidak broken
  # ============================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: plts-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build image simulator
        uses: docker/build-push-action@v6
        with:
          context: ./simulator
          push: false
          tags: plts-simulator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
